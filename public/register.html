<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三角洲行动论坛‑注册账号</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background: linear-gradient(-45deg, #0f0c29,#302b63,#24243e,#1a2980,#26d0ce);
  background-size: 400% 400%;
  animation: gradientFlow 12s ease infinite;
  background-attachment:fixed;
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.card{
  width:100%;
  max-width:440px;
  padding:36px 28px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  box-shadow:0 12px 45px rgba(0,0,0,0.35);
}
h2{
  text-align:center;
  font-size:24px;
  margin-bottom:28px;
  background:linear-gradient(90deg,#00f5a0,#00d9f5,#ff2a6d);
  -webkit-background-clip:text;
  color:transparent;
}
input{
  width:100%;
  padding:14px 16px;
  margin:10px 0;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  color:#fff;
  font-size:15px;
  transition:0.3s;
}
input:focus{
  outline:none;
  border-color:#00f5a0;
  box-shadow:0 0 0 4px rgba(0,245,160,0.15);
}
.row{
  display:flex;
  gap:10px;
}
@media(max-width:400px){
  .row{
    flex-direction:column;
  }
}
.btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#00f5a0,#00d9f5);
  color:#08111f;
  box-shadow:0 6px 22px rgba(0,245,160,0.28);
  transition:0.3s ease;
}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,245,160,0.4);
}
.btn:disabled{
  opacity:0.45;
  cursor:not-allowed;
  transform:none;
}
.btn-small{
  width:150px;
  flex-shrink:0;
  margin-top:10px;
}
@media(max-width:400px){
  .btn-small{
    width:100%;
  }
}
.link{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#b8c8ff;
  text-decoration:none;
  transition:0.25s;
}
.link:hover{
  color:#00f5a0;
  text-shadow:0 0 8px rgba(0,245,160,0.5);
}

/*自定义悬浮弹窗*/
#myModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(10,10,30,0.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-inner{
  width:100%;
  max-width:340px;
  background:#2b2855;
  padding:32px 24px;
  border-radius:18px;
  border:1px solid #524e99;
  box-shadow:0 0 24px #39348077;
}
#modalText{
  color:#54ffd8;
  text-align:center;
  margin-bottom:24px;
  font-size:17px;
}
.modal-btn{
  width:100%;
  padding:10px;
  background:linear-gradient(90deg,#22e299,#08d0dd);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:bold;
  font-size:15px;
}
</style>
</head>
<body>
<div class="card">
  <h2>📩邮箱验证码注册</h2>
  <input type="email" id="email" placeholder="请输入邮箱地址">
  <div class="row">
    <input type="text" id="code" placeholder="6位验证码">
    <button id="sendCodeBtn" class="btn btn-small" onclick="sendCode()">获取验证码</button>
  </div>
  <input type="text" id="username" placeholder="设置论坛昵称">
  <input type="password" id="pwd" placeholder="设置登录密码">
  <button class="btn" onclick="doRegister()">完成注册</button>
  <a class="link" href="/login">已有账号？前往登录</a>
</div>

<!--弹窗组件-->
<div id="myModal">
  <div class="modal-inner">
    <h3 id="modalText"></h3>
    <button class="modal-btn" onclick="closeModal()">确定</button>
  </div>
</div>

<script>
function showModal(msg){
    document.getElementById("modalText").innerText = msg;
    document.getElementById("myModal").style.display = "flex";
}
function closeModal(){
    document.getElementById("myModal").style.display = "none";
}

let countdownTimer = null;
//页面离开清除定时器，防止后台继续跑
window.addEventListener('beforeunload',()=>{
  if(countdownTimer) clearInterval(countdownTimer);
});

async function sendCode(){
  const btn = document.getElementById("sendCodeBtn");
  const email = document.getElementById("email").value.trim().toLowerCase();
  if(!email){
    showModal("请输入邮箱地址");
    return;
  }
  try{
    const res = await fetch("/send-code",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email})
    })
    const d = await res.json();
    if(d.ok){
      showModal(d.msg||"验证码已发送邮箱，请查收");
      //开启60秒倒计时
      let count = 60;
      btn.disabled = true;
      btn.innerText = `${count}秒后重发`;
      countdownTimer = setInterval(()=>{
        count--;
        btn.innerText = `${count}秒后重发`;
        if(count <= 0){
          clearInterval(countdownTimer);
          countdownTimer=null;
          btn.disabled = false;
          btn.innerText = "获取验证码";
        }
      },1000);
    }else{
      showModal(d.msg);
    }
  }catch(err){
    console.error(err);
    showModal("请求出错，请检查后端是否启动");
  }
}

async function doRegister(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const code = document.getElementById("code").value.trim();
  const username = document.getElementById("username").value.trim();
  const pwd = document.getElementById("pwd").value.trim();
  if(!email||!code||!username||!pwd){
    showModal("所有输入项不能为空");
    return;
  }
  try{
    const res = await fetch("/register-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,code,username,password:pwd})
    })
    const d = await res.json();
    if(d.ok){
      showModal("🎉注册成功！即将跳转登录页面");
      setTimeout(()=>{
        location.href="/login";
      },1200);
    }else{
      showModal(d.msg);
    }
  }catch(err){
    console.error(err);
    showModal("注册请求失败，请确认后端运行正常");
  }
}
</script>
</body>
</html>
