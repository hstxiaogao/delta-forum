<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发布帖子 - 三角洲行动论坛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,"Microsoft YaHei",sans-serif;}
::-webkit-scrollbar {width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5a0,#00d9f5);border-radius:4px;}

body{
  min-height:100vh;
  background: linear-gradient(-45deg, #0f0c29,#302b63,#24243e,#1a2980,#26d0ce);
  background-size: 400% 400%;
  animation: gradientFlow 12s ease infinite;
  background-attachment:fixed;
  color:#e6edff;
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
nav{
  padding:14px 16px;
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(12px);
  position:sticky;
  top:0;
  z-index:99;
}
.nav-wrap{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
nav a{
  color:#b8c8ff;
  text-decoration:none;
  font-size:15px;
  transition:0.25s;
}
nav a:hover{
  color:#00f5a0;
  text-shadow:0 0 8px rgba(0,245,160,0.5);
}
.nav-user-text{
  color:#00f5a0;
  font-weight:bold;
  margin-left:auto;
  font-size:14px;
}
.container{
  max-width:720px;
  margin:24px auto;
  padding:0 14px;
}
.form-card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.11);
  border-radius:18px;
  padding:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}
h2{
  background:linear-gradient(90deg,#00f5a0,#00d9f5,#ff2a6d);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:22px;
  font-size:22px;
}
input,textarea{
  width:100%;
  padding:12px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  color:#fff;
  margin:10px 0;
  font-size:16px;
}
input[type="file"]{
  background:rgba(255,255,255,0.04);
  padding:8px;
}
.btn{
  padding:12px 24px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#00f5a0,#00d9f5);
  color:#08111f;
  transition:0.3s ease;
  width:100%;
  margin-top:8px;
  font-size:16px;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,245,160,0.35);
}
.btn-logout{
  background:linear-gradient(135deg,#ff4b60,#ff9068);
  color:#fff;
  width:auto;
  padding:6px 12px;
  font-size:14px;
}
.hidden{display:none !important;}

/* 自定义弹窗样式 */
#myModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(10,10,30,0.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-inner{
  width:100%;
  max-width:340px;
  background:#2b2855;
  padding:32px 24px;
  border-radius:18px;
  border:1px solid #524e99;
  box-shadow:0 0 24px #39348077;
}
#modalText{
  color:#54ffd8;
  text-align:center;
  margin-bottom:24px;
  font-size:17px;
}
.modal-btn{
  width:100%;
  padding:10px;
  background:linear-gradient(90deg,#22e299,#08d0dd);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:bold;
  font-size:15px;
}

@media(min-width:768px){
  .nav-wrap{gap:24px;}
  nav a{font-size:16px;}
  .container{margin:40px auto;padding:0 20px;}
  .form-card{padding:28px;}
  h2{font-size:26px;}
}
</style>
</head>
<body>
<nav>
  <div class="nav-wrap">
    <a href="/">首页</a>
    <a href="/create-post">发布帖子</a>
    <div id="areaGuest">
      <a href="/register">注册</a>
      <a href="/login">登录</a>
    </div>
    <div id="areaLogin" class="hidden">
      <span class="nav-user-text">欢迎：<span id="showUserName"></span></span>
      <button class="btn btn-logout" onclick="logout()">退出登录</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="form-card">
    <h2>发布新帖子</h2>
    <input type="text" id="title" placeholder="帖子标题">
    <textarea id="content" rows="8" placeholder="帖子内容"></textarea>

    <div>📷选择图片：<input type="file" id="imgFile" accept="image/*"></div>
    <div>🔊选择音频：<input type="file" id="audioFile" accept="audio/*"></div>

    <button class="btn" onclick="submitPost()">提交发布</button>
  </div>
</div>

<!--悬浮弹窗组件-->
<div id="myModal">
  <div class="modal-inner">
    <h3 id="modalText"></h3>
    <button class="modal-btn" onclick="closeModal()">确定</button>
  </div>
</div>

<script>
//弹窗函数
function showModal(msg){
    document.getElementById("modalText").innerText = msg;
    document.getElementById("myModal").style.display = "flex";
}
function closeModal(){
    document.getElementById("myModal").style.display = "none";
}

let user = JSON.parse(localStorage.getItem("forum_user")||"null");

function renderNav(){
  if(user){
    document.getElementById("areaGuest").classList.add("hidden");
    document.getElementById("areaLogin").classList.remove("hidden");
    document.getElementById("showUserName").innerText = user.username;
  }else{
    document.getElementById("areaGuest").classList.remove("hidden");
    document.getElementById("areaLogin").classList.add("hidden");
  }
}
function logout(){
  localStorage.removeItem("forum_user");
  location.href="/";
}

//没有登录直接跳登录页
if(!user){
  showModal("请先登录");
  setTimeout(()=>{
    location.href="/login";
  },1200);
}

async function submitPost(){
  try{
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const imgFile = document.getElementById("imgFile").files[0];
    const audioFile = document.getElementById("audioFile").files[0];

    if(!title||!content){
      showModal("标题和内容不能为空");
      return;
    }

    let imgUrl = "";
    let audioUrl = "";
    //有文件才上传
    if(imgFile || audioFile){
      const fd = new FormData();
      if(imgFile) fd.append("img",imgFile);
      if(audioFile) fd.append("audio",audioFile);
      const upRes = await fetch("/upload-file",{method:"POST",body:fd});
      const upData = await upRes.json();
      if(!upData.ok){
        showModal("文件上传失败："+(upData.msg||"未知错误"));
        return;
      }
      imgUrl = upData.imgUrl;
      audioUrl = upData.audioUrl;
    }

    //提交帖子
    const postRes = await fetch("/post-add",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:user.username,
        title:title,
        content:content,
        img_url:imgUrl,
        audio_url:audioUrl
      })
    })
    const postData = await postRes.json();
    if(!postData.ok){
      showModal("发帖失败："+(postData.msg||"数据库错误"));
      return;
    }
    showModal("发帖成功！");
    setTimeout(()=>{
      location.href="/";
    },1200);
  }catch(err){
    console.error(err);
    showModal("网络异常，发帖失败");
  }
}

renderNav();
</script>
</body>
</html>
