<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三角洲行动论坛‑登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background: linear-gradient(-45deg, #0f0c29,#302b63,#24243e,#1a2980,#26d0ce);
  background-size: 400% 400%;
  animation: gradientFlow 12s ease infinite;
  background-attachment:fixed;
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.card{
  width:100%;
  max-width:420px;
  padding:36px 28px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  box-shadow:0 12px 45px rgba(0,0,0,0.35);
}
h2{
  text-align:center;
  font-size:24px;
  margin-bottom:28px;
  background:linear-gradient(90deg,#00f5a0,#00d9f5,#ff2a6d);
  -webkit-background-clip:text;
  color:transparent;
}
input{
  width:100%;
  padding:14px 16px;
  margin:10px 0;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  color:#fff;
  font-size:15px;
  transition:0.3s;
}
input:focus{
  outline:none;
  border-color:#00f5a0;
  box-shadow:0 0 0 4px rgba(0,245,160,0.15);
}
.btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#00f5a0,#00d9f5);
  color:#08111f;
  box-shadow:0 6px 22px rgba(0,245,160,0.28);
  transition:0.3s ease;
}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,245,160,0.4);
}
.link{
  display:block;
  text-align:center;
  margin-top:12px;
  color:#b8c8ff;
  text-decoration:none;
  transition:0.25s;
}
.link:hover{
  color:#00f5a0;
  text-shadow:0 0 8px rgba(0,245,160,0.5);
}

/* 自定义页面悬浮弹窗（代替alert） */
#myModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(10,10,30,0.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-inner{
  width:100%;
  max-width:340px;
  background:#2b2855;
  padding:32px 24px;
  border-radius:18px;
  border:1px solid #524e99;
  box-shadow:0 0 24px #39348077;
}
#modalText{
  color:#54ffd8;
  text-align:center;
  margin-bottom:24px;
  font-size:17px;
}
.modal-btn{
  width:100%;
  padding:10px;
  background:linear-gradient(90deg,#22e299,#08d0dd);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:bold;
  font-size:15px;
}
</style>
</head>
<body>
<div class="card">
  <h2>🔐论坛账号登录</h2>
  <input type="email" id="email" placeholder="输入注册邮箱">
  <input type="password" id="pwd" placeholder="输入登录密码">
  <button class="btn" onclick="doLogin()">登录</button>
  <a class="link" href="/resetpwd">忘记密码？</a>
  <a class="link" href="/register">没有账号？去注册</a>
</div>

<!-- 自定义弹窗 -->
<div id="myModal">
  <div class="modal-inner">
    <h3 id="modalText"></h3>
    <button class="modal-btn" onclick="closeModal()">确定</button>
  </div>
</div>

<script>
//弹窗函数
function showModal(msg){
    document.getElementById("modalText").innerText = msg;
    document.getElementById("myModal").style.display = "flex";
}
function closeModal(){
    document.getElementById("myModal").style.display = "none";
}

async function doLogin(){
  try{
    const email = document.getElementById("email").value.trim();
    const pwd = document.getElementById("pwd").value.trim();
    const res = await fetch("/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pwd})
    })
    const d = await res.json();
    if(d.ok){
      localStorage.setItem("forum_user",JSON.stringify(d.user));
      showModal("🎉登录成功！即将跳转论坛首页");
      setTimeout(()=>{
        location.href="/";
      },1200)
    }else{
      showModal(d.msg);
    }
  }catch(err){
    console.error(err);
    showModal("请求出错！检查后端是否启动："+err.message);
  }
}
</script>
</body>
</html>
